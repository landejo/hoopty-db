  - {key: cv_boots, label: "CV boots condition"}
  - {key: exhaust_manifold_tick, label: "Exhaust manifold tick / cracks"}
  - {key: cracked_dash, label: "Cracked dashboard"}
  - {key: ac_function, label: "A/C function (cold, both zones)"}
  - {key: leaks, label: "Visible engine / drivetrain leaks"}
