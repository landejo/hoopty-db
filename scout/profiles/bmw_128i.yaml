years: [2008, 2013]
source: seed
verified: true
mission_default: enthusiast_bridge
risk_reserve: 1500
automatic_ok: false
framing: >
  Primary bridge candidate: compact rear-drive BMW character with the naturally
  aspirated N52 six and none of the 335i's turbo complexity. Manual, Sport or
  M Sport, stock powertrain.
weak_points: >
  Electric water pump and thermostat; oil-filter-housing, valve-cover and oil-pan
  leaks; cooling hoses and expansion tank; suspension bushings and shocks; clutch
  wear; window regulators/electronics; convertible top and water ingress.
immediate_repairs: fluids, tires, expansion tank / hoses if aged
repairs_12mo: electric water pump + thermostat if undocumented, oil-filter-housing gasket, bushings
market_notes: Manual Sport/M Sport cars carry a premium; automatics are plentiful and cheaper but do not fit the brief.
catchup_notes: Cooling-system and oil-leak records matter more than mileage.
