automatic_ok: false
framing: 'Secondary bridge candidate named in guide s13. Genuinely distinctive hatchback: compact, usable,
  and rare with the M66 6-speed manual. Satisfies the compact-hatchback preference in s2 and the quirky-but-coherent
  test in s4. It is a turbocharged FWD European car, so it carries cooling, oil-leak, and PCV exposure;
  do not represent it as Toyota-like. Local service access is the standing weak point: Mark Aiello works
  on Volkswagens, not Volvos. Favor stock examples.'
weak_points: Underbody and rocker/quarter-panel corrosion on rust-belt cars; PCV / oil-trap clogging on
  the B5254T7, which pushes out the rear main seal; timing belt interval; cooling system; engine mounts;
  suspension bushings and shocks; sunroof drains; clutch and slave cylinder; turbo control valve; parts
  and independent-service access outside metro areas.
immediate_repairs: tires if date-coded out, PCV/oil trap if undocumented, fluids
repairs_12mo: clutch if worn, cooling components, engine mounts, suspension bushings, sunroof drains
market_notes: Manual T5 cars are the ones worth having and are a small share of production. Clean, documented,
  rust-free Western or Southern examples are the target. Midwest cars trade down hard on underbody condition.
  No comps in this database yet - the pool needs building before price reads are reliable.
catchup_notes: If the timing belt interval and the PCV/oil trap are both undocumented on a 100k+ car,
  budget both as catch-up rather than treating recent minor service as absolution (guide s14, lesson 5).
